[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sif-guard"
version = "0.1.0"
description = "AI/NLP-powered Serious Injury & Fatality Precursor Intelligence Platform for Oil India Limited"
authors = [{ name = "SIF-Guard Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "hdbscan>=0.8.29",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "pgvector>=0.2.0",
    "psycopg2-binary>=2.9.6",
    "openpyxl>=3.1.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "mlflow>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-asyncio>=0.21.0"
]
